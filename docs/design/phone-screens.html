<title>מסכי הטלפון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<style>
/* Layout: intro, then a wrapping row of numbered phone mocks (the real sign-up flow, in order), each with a caption; single dark theme to match the hall screen */
:root{--bg:#05070f;--fg:#f3e6c4;--muted:#a99d80;--gold:#e3b45a;--gold2:#f6d58e;--navy:#0d1638;--line:#2a3352;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Heebo",system-ui,sans-serif;direction:rtl;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1{margin:0;font-size:clamp(1.4rem,3vw,2rem)}
.intro p{margin:6px 0 0;color:var(--muted);max-width:75ch;line-height:1.6}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px}
figure{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center}
figcaption{max-width:260px;font-size:.9rem;color:var(--muted);line-height:1.55}
figcaption b{display:block;color:var(--fg);font-size:1rem;margin-bottom:2px}
.ph{width:250px;max-width:100%;aspect-ratio:9/19.3;border-radius:34px;padding:9px;background:#11131a;box-shadow:0 0 0 1px #2b2f3b,0 18px 40px rgba(0,0,0,.6)}
.sc{position:relative;height:100%;border-radius:26px;overflow:hidden;background:radial-gradient(110% 60% at 50% 0%,#1b2a5e 0%,#0b1230 55%,#060a1c 100%);padding:34px 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:12px}
.sc::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:70px;height:18px;border-radius:10px;background:#000}
.logos{display:flex;justify-content:center;align-items:center;gap:10px}
.logos img{height:28px;width:auto}.logos img.bt{height:32px}
.t{font-family:"Frank Ruhl Libre",serif;font-weight:900;color:var(--gold);text-align:center;line-height:1.05}
.sub{text-align:center;color:var(--fg);opacity:.85;line-height:1.45}
.btn{display:block;text-align:center;border-radius:14px;padding:12px 10px;font-weight:800;font-size:13px}
.gold{background:linear-gradient(180deg,#f6d58e,#d9a447);color:#1a1200;box-shadow:0 6px 18px rgba(227,180,90,.35)}
.ghost{border:1px solid rgba(227,180,90,.45);color:var(--gold2)}
.link{text-align:center;color:var(--muted);text-decoration:underline;font-size:11px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10.5px;color:var(--muted)}
.f .in{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:#fff;font-size:12px}
.f .in.focus{border-color:var(--gold)}
.ac{background:#111a3d;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:-2px}
.ac div{padding:6px 10px;border-bottom:1px solid var(--line);font-size:11.5px}.ac div:first-child{background:rgba(227,180,90,.14)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:10.5px;line-height:1.45;color:var(--fg)}
.chk i{flex:none;width:15px;height:15px;border-radius:4px;background:var(--gold);display:grid;place-items:center;color:#1a1200;font-style:normal;font-size:11px;font-weight:900}
.steps{display:flex;justify-content:center;gap:6px}.steps i{width:22px;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--gold)}
.cam{position:relative;flex:1;border-radius:18px;background:linear-gradient(160deg,#4a5a63,#2a3138);overflow:hidden;display:grid;place-items:center}
.cam .ring{position:relative;z-index:1;width:170px;height:170px;border-radius:50%;box-shadow:0 0 0 400px rgba(4,7,18,.62),inset 0 0 0 3px var(--gold2)}
.face{position:absolute;width:150px;height:170px}
.shot{display:flex;justify-content:space-around;align-items:center}
.shot .s{width:54px;height:54px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.2)}
.shot span{font-size:11px;color:var(--fg)}
.av{border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(227,180,90,.45);margin-inline:auto}
.big{width:130px;height:130px}
.join{position:relative;margin-top:auto;border-radius:20px;padding:20px 14px;text-align:center;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:18px;line-height:1.25;color:#1a1200;background:radial-gradient(120% 140% at 50% 0%,#fff1c8,#e3b45a 55%,#b9822c);box-shadow:0 0 0 2px #f6d58e,0 0 38px rgba(246,213,142,.6)}
.join small{display:block;font-family:"Heebo";font-weight:600;font-size:10.5px;opacity:.75;margin-top:6px}
.who{display:flex;flex-direction:column;gap:7px}
.who div{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:7px 9px}
.who .m{width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--gold);flex:none}
.who b{font-size:12px}.who span{font-size:10px;color:var(--muted)}
.who em{margin-right:auto;font-style:normal;font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:9px;background:var(--gold);color:#1a1200}
.who em.done{background:transparent;color:#9fd39a;border:1px solid #4f7a4b}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 34%,rgba(246,213,142,.12) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle at 50% 34%,#000,transparent 70%);mask:radial-gradient(circle at 50% 34%,#000,transparent 70%)}
.ok{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:22px;color:var(--gold2);text-align:center;line-height:1.15}
.tag{align-self:center;font-size:10.5px;padding:4px 10px;border-radius:20px;border:1px solid rgba(227,180,90,.5);color:var(--gold2)}
.note{color:var(--muted);font-size:.9rem;max-width:80ch;line-height:1.6;margin:0}
</style>

<div class="wrap">
  <div class="intro">
    <h1>מסכי הטלפון</h1>
    <p>כך נראה המסלול של משתתף מהסריקה של קוד ה-QR ועד שהתמונה שלו על המסך. אותם צבעים ולוגואים כמו במסך האולם. אין התקנה וגם לא סיסמה: הטלפון זוכר מי נרשם ממנו.</p>
  </div>
  <div class="row" id="row"></div>
  <p class="note">הצלליות מחליפות את הסלפי האמיתיים. כל הטקסטים בעברית ומימין לשמאל, והכפתורים גדולים כדי שיהיה קל ללחוץ עליהם גם באולם חשוך.</p>
</div>

<script>
const L='<div class="logos"><img src="assets/logo_beit_midrash_gold.png" alt="בית המדרש תורה והלכה"><img class="bt" src="assets/logo_batvuna_gold.png" alt="בתבונה"></div>';
const face=(h=200,sk='#c79a6e',bg=true)=>`<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">${bg?`<rect width="100" height="100" fill="hsl(${h} 25% 36%)"/>`:''}<path d="M10 100 C12 80 30 70 50 70 C70 70 88 80 90 100 Z" fill="#1d222b"/><rect x="43" y="54" width="14" height="18" rx="5" fill="${sk}"/><ellipse cx="50" cy="44" rx="16" ry="19" fill="${sk}"/><path d="M33 37 C34 22 66 22 67 37 C61 31 39 31 33 37 Z" fill="#14161a"/></svg>`;
const screens=[
['1. פתיחה','מה שנפתח אחרי סריקת ה-QR. כפתור אחד ראשי להרשמה, וקישור למי שכבר נרשם (למשל אם החליף טלפון או סגר את הדפדפן).',
 `<div style="height:14px"></div>${L}<div class="t" style="font-size:30px;margin-top:18px">נבחרת<br>השגרירים</div><div class="sub" style="font-size:13px">מאירים את הארץ<br>בנקודות של תורה</div>
  <div style="flex:1;display:grid;place-items:center"><div style="width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(246,213,142,.5),transparent 70%)"></div></div>
  <div class="sub" style="font-size:11.5px;color:var(--muted)">הרשמה של דקה, ותמונה שתופיע על המסך הגדול</div><a class="btn gold">להרשמה</a><div class="link">כבר נרשמתי</div>`],
['2. פרטים','ארבעה שדות חובה ותיבת הסכמה. היישוב נבחר מרשימה עם השלמה אוטומטית, כדי שיידלק במקום הנכון במפה. מספר טלפון שכבר רשום מעדכן את הרשומה ולא יוצר כפילות.',
 `<div class="steps"><i class="on"></i><i></i><i></i></div><div class="t" style="font-size:18px">הפרטים שלך</div>
  <div class="f"><label>שם פרטי ומשפחה</label><div class="in">יוסף כהן</div></div>
  <div class="f"><label>טלפון נייד</label><div class="in" style="direction:ltr;text-align:right">050-123-4567</div></div>
  <div class="f"><label>דוא"ל</label><div class="in" style="direction:ltr;text-align:right">yosef@example.com</div></div>
  <div class="f"><label>יישוב מגורים</label><div class="in focus">אל|</div><div class="ac"><div>אלעד</div><div>אלון שבות</div><div>אלקנה</div></div></div>
  <div class="chk"><i>✓</i><span>אני מסכים/ה שתמונתי ושמי יוצגו על המסך באולם, ושבית המדרש ייצור איתי קשר בנושא השגרירים.</span></div>
  <a class="btn gold" style="margin-top:auto">המשך לתמונה</a>`],
['3. סלפי','המצלמה הקדמית נפתחת עם מסגרת עגולה, בדיוק כמו העיגול על המסך. אפשר לבחור מהגלריה או לדלג, ואז יוצגו ראשי התיבות. אחרי הצילום: "צלם שוב" או "אישור".',
 `<div class="steps"><i class="on"></i><i class="on"></i><i></i></div><div class="t" style="font-size:18px">תמונה לקיר השגרירים</div><div class="sub" style="font-size:11px">הכנס את הפנים לעיגול</div>
  <div class="cam"><div class="face">${face(205,'#c9a07a',false)}</div><div class="ring"></div></div>
  <div class="shot"><span>מהגלריה</span><div class="s"></div><span>דלג</span></div>`],
['4. כפתור ההצטרפות','הכפתור הגדול. כשהמנחה מזמין מהבמה, לוחצים עליו. אם נרשמו כמה אנשים מאותו טלפון, כל אחד מקבל כפתור משלו ברשימה למטה. כאן גם אפשר לרשום עוד משתתף או להחליף תמונה.',
 `<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>${L}
  <div class="av big" style="margin-top:6px">${face(205,'#c9a07a')}</div><div style="text-align:center"><b style="font-size:15px">יוסף כהן</b><div style="color:var(--muted);font-size:11px">אלעד · <u>החלף תמונה</u></div></div>
  <div class="join">אני מצטרף להיות שגריר של תורה והלכה<small>לחיצה אחת, והתמונה עולה למסך הגדול</small></div>
  <div class="who"><div><span class="m">${face(30,'#b98a5e')}</span><span><b>שמעון לוי</b><br><span>נרשם מהטלפון הזה</span></span><em>צרף</em></div></div>
  <div class="link">+ רשום משתתף נוסף מהטלפון הזה</div>`],
['5. ברוך הבא לנבחרת','מיד אחרי הלחיצה. הטלפון רוטט, והמסך מראה שהתמונה עלתה עכשיו על המסך הגדול. לחיצה נוספת לא תוסיף אותו שוב.',
 `<div class="rays"></div>${L}<div class="av big" style="margin-top:22px;width:150px;height:150px;box-shadow:0 0 0 4px #f6d58e,0 0 60px rgba(246,213,142,.7)">${face(205,'#c9a07a')}</div>
  <div class="ok" style="margin-top:8px">ברוך הבא<br>לנבחרת השגרירים!</div><span class="tag">השגריר ה-32 · אלעד</span>
  <div class="sub" style="font-size:12px;margin-top:4px">הבט למסך הגדול,<br>התמונה שלך עולה עכשיו</div>
  <div class="who" style="margin-top:auto"><div><span class="m">${face(30,'#b98a5e')}</span><span><b>שמעון לוי</b><br><span>נרשם מהטלפון הזה</span></span><em>צרף</em></div></div>`],
['6. כבר נרשמתי','מי שחוזר מטלפון אחר, או אחרי שסגר את הדפדפן, מזין את מספר הטלפון ומגיע ישר לכפתור ההצטרפות. בלי SMS ובלי סיסמה.',
 `<div style="height:14px"></div>${L}<div class="t" style="font-size:20px;margin-top:20px">כבר נרשמת?</div><div class="sub" style="font-size:12px">הזן את מספר הטלפון שאיתו נרשמת</div>
  <div class="f" style="margin-top:14px"><label>טלפון נייד</label><div class="in focus" style="direction:ltr;text-align:right;font-size:15px;padding:11px">050-123-4567</div></div>
  <a class="btn gold">המשך</a><div class="link" style="margin-top:6px">לא נרשמתי עדיין</div>
  <div class="sub" style="margin-top:auto;font-size:10.5px;color:var(--muted)">לא מוצא? פנה לצוות בכניסה לאולם</div>`]
];
const row=document.getElementById('row');
screens.forEach(([t,c,h])=>row.insertAdjacentHTML('beforeend',`<figure><div class="ph"><div class="sc">${h}</div></div><figcaption><b>${t}</b>${c}</figcaption></figure>`));
</script>
